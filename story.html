<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三亚大东海 · 节点设计方案 | 滚动叙事</title>
<!-- MapLibre GL JS 5.24.0 与 three.js r169（含 GLTFLoader）均已打包在 lib/，双击即可离线打开 -->
<link rel="stylesheet" href="lib/maplibre-gl.css">
<style>
:root{--ui:'Microsoft YaHei','微软雅黑','PingFang SC','Noto Sans SC','Source Han Sans SC','Noto Sans CJK SC',sans-serif;--pink:#FE5783;--fs:16px}
html,body{margin:0;height:100%;overflow:hidden;background:#eeedeb;font-family:var(--ui);color:#111}
#map{position:absolute;inset:0}
#frame{position:absolute;pointer-events:none;z-index:3;font-size:var(--fs)}
/* 标题（PPT 左上） */
#title{position:absolute;left:3.94%;top:6.3%;opacity:0;transform:translateY(-.6rem);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#title.on{opacity:1;transform:none}
#title h1{margin:0;font-size:2.4rem;font-weight:800;letter-spacing:.06em;line-height:1.25;text-shadow:0 0 .8rem rgba(255,255,255,.9),0 0 .25rem #fff}
#title h2{margin:.1rem 0 0;font-size:1.02rem;font-weight:400;letter-spacing:.02em;text-shadow:0 0 .5rem #fff}
/* 指标面板（PPT 右下） */
#panel{position:absolute;left:79.79%;top:58.42%;width:16.75%;height:38.34%;background:#fff;border-radius:1.1rem;box-shadow:0 .3rem 1.4rem rgba(0,0,0,.12);
  font-size:.66rem;pointer-events:auto;display:flex;flex-direction:column;box-sizing:border-box;padding:.9rem .5rem .7rem 1.1rem}
#panel .tot{font-weight:700;line-height:1.35} #panel .tot b{font-size:.95rem}
#panel .bars{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
#panel .above,#panel .below{display:flex;flex-direction:column}
#panel .above{justify-content:flex-end;flex:1} #panel .below{flex:1}
#panel .axis{height:0;border-top:1.5px solid #222;margin:0 .4rem 0 -.4rem}
#panel .seg{position:relative;height:0;transition:height .9s cubic-bezier(.4,0,.2,1);overflow:visible}
#panel .seg i{position:absolute;left:0;top:0;bottom:0;width:26%;}
#panel .seg span{position:absolute;left:34%;top:50%;transform:translateY(calc(-50% + var(--dy,0rem)));white-space:nowrap;opacity:0;transition:opacity .6s,transform .9s cubic-bezier(.4,0,.2,1);font-weight:600}
#panel .seg span em{font-style:normal;font-weight:600}
#panel .seg.on span{opacity:1}
/* 卡片 */
#cards{position:absolute;inset:0;pointer-events:none;z-index:4;font-size:var(--fs)}
#pointers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.cw{position:absolute;left:0;top:0;will-change:transform}
.cw>*{opacity:0;transform:translateY(.9rem) scale(.97);transition:opacity .5s ease,transform .65s cubic-bezier(.2,.8,.2,1)}
.cw.on>*{opacity:1;transform:none}
.cw.off>*{opacity:0;transform:translateY(-.5rem) scale(.98);transition-duration:.35s}
.card{position:relative;pointer-events:auto}
.card .in{position:relative;background:#fff;border-radius:.75rem;padding:.55rem 1.05rem .6rem;box-shadow:-.7rem .85rem 0 0 var(--ac),0 .4rem 1.2rem rgba(0,0,0,.18);white-space:nowrap}
.card .t{font-size:1.5rem;line-height:1.3}
.card .t b{font-weight:800;letter-spacing:.04em}
.card .bar{margin:0 .45rem;font-weight:800}
.card .tag{font-weight:400}
.card .e{font-size:1.02rem;line-height:1.35;font-weight:800}
.card .e .g{font-weight:400}
.card .g2{font-size:1.15rem;font-weight:700;margin-top:.1rem}
.card .ln{font-size:1rem;line-height:1.45}
.card .d{font-size:.78rem;line-height:1.45;margin-top:.35rem;white-space:normal;width:15.5rem;font-weight:600}
.card .de{font-size:.7rem;line-height:1.35;white-space:normal;width:15.5rem;color:#333;font-family:'Times New Roman',Georgia,serif}
.card.big .t{font-size:1.4rem}.card.big .e{font-size:1.45rem;letter-spacing:.02em}
.card.small .in{padding:.4rem .9rem .45rem;text-align:center;box-shadow:.55rem .55rem 0 0 var(--ac),0 .3rem .9rem rgba(0,0,0,.15)}
.card.small .t{font-size:1.15rem}.card.small .e{font-size:.72rem}
.card .ph{display:block;width:14.4rem;margin-top:.55rem;border-radius:.5rem;box-shadow:-.7rem .85rem 0 0 var(--ac),0 .4rem 1rem rgba(0,0,0,.2)}
.lbl{text-align:center;line-height:1.2;text-shadow:0 0 .35rem #fff,0 0 .2rem #fff}
.lbl b{display:block;font-size:1.1rem;font-weight:800}.lbl i{display:block;font-style:normal;font-size:.62rem;font-weight:700}.lbl s{display:block;text-decoration:none;font-size:.62rem;font-weight:700}
.strip{width:48.32vw;max-width:calc(var(--fs)*48.3);padding:.5rem;background:var(--ac);border-radius:1.1rem;box-shadow:0 .4rem 1.2rem rgba(0,0,0,.2)}
.strip img{display:block;width:100%;border-radius:.75rem}
/* 导航 */
#progress{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(0,0,0,.06);z-index:6}
#progress i{display:block;height:100%;width:0;background:var(--pink);transition:width .8s cubic-bezier(.4,0,.2,1)}
#dots{position:absolute;right:14px;top:36%;transform:translateY(-50%);list-style:none;margin:0;padding:0;z-index:6}
#dots li{position:relative;width:26px;height:26px;margin:7px 0;border-radius:50%;background:rgba(255,255,255,.88);box-shadow:0 1px 5px rgba(0,0,0,.18);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#777;transition:all .3s}
#dots li span{font-weight:700}
#dots li em{position:absolute;right:34px;white-space:nowrap;font-style:normal;font-size:12.5px;background:rgba(20,20,20,.82);color:#fff;padding:4px 9px;border-radius:5px;opacity:0;pointer-events:none;transform:translateX(6px);transition:all .25s}
#dots li:hover em{opacity:1;transform:none}
#dots li.done{background:#ffe3ea;color:var(--pink)}
#dots li.on{background:var(--pink);color:#fff;transform:scale(1.18)}
#nav{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:6;background:rgba(255,255,255,.9);
  border-radius:999px;padding:5px 8px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:13px}
#nav button{border:0;background:#f3f1ef;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;color:#333}
#nav button:hover{background:var(--pink);color:#fff}
#count{min-width:58px;text-align:center;color:#888;font-variant-numeric:tabular-nums}#count b{color:#111;font-size:15px}
#nav .tool{width:auto;border-radius:999px;padding:0 12px;font-size:12px;font-family:var(--ui)}
#nav .tool.alt{background:#2b2b2b;color:#fff}
#hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);font-size:11.5px;color:#666;background:rgba(255,255,255,.75);padding:3px 10px;border-radius:999px;z-index:5;white-space:nowrap}
/* 设置 */
#gear,#fs{position:absolute;top:12px;z-index:7;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 6px rgba(0,0,0,.18);cursor:pointer;font-size:17px}
#gear{right:14px}#fs{right:56px}
#settings{position:absolute;right:14px;top:56px;width:280px;max-height:calc(100vh - 140px);overflow:auto;background:rgba(255,255,255,.96);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);
  z-index:7;font-size:12.5px;padding:10px 14px;display:none}
#settings.open{display:block}
#settings h4{margin:10px 0 4px;font-size:11px;color:#999;font-weight:normal;letter-spacing:1px}
#settings label{display:flex;align-items:center;gap:6px;padding:2px 0;cursor:pointer}
#settings input{accent-color:var(--pink)}
#crsinfo,#settings .note{color:#888;font-size:11px;margin-top:3px;line-height:1.5}
/* 效果图对照 */
#compare{position:absolute;z-index:2;pointer-events:none;opacity:.5;display:none}
#compare.show{display:block}#compare img{width:100%;height:100%;display:block}
#toast{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
body.drop::after{content:'松开以载入 GLB 模型（文件名 = 图层名，如 S3_HOTEL.glb；或多图层 GLB）';position:fixed;inset:20px;border:3px dashed var(--pink);border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--pink);background:rgba(255,255,255,.7);z-index:20}
body.clean #nav,body.clean #dots,body.clean #hint,body.clean #gear,body.clean #fs,body.clean #progress,body.clean .maplibregl-ctrl-bottom-right,body.clean .maplibregl-ctrl-bottom-left{display:none}
.maplibregl-ctrl-bottom-right{bottom:10px}
.maplibregl-ctrl-attrib{font-size:10px}
</style></head>
<body>
<div id="map"></div>
<div id="compare"><img alt="PPT 效果图"></div>
<svg id="pointers"></svg>
<div id="frame"><div id="title"></div><div id="panel"></div></div>
<div id="cards"></div>
<div id="progress"><i></i></div>
<ul id="dots"></ul>
<div id="hint"><span id="hint-wheel"></span></div>
<div id="nav">
  <button id="prev" title="上一阶段（↑ / ←）">▲</button>
  <div id="count"></div>
  <button id="next" title="下一阶段（↓ / → / 空格）">▼</button>
  <button id="recenter" class="tool" title="回到本阶段视角（R）">⟲ 复位视角</button>
  <button id="wheelmode" class="tool" title="切换滚轮行为（M）">滚轮：切换阶段</button>
</div>
<button id="fs" title="全屏">⛶</button>
<button id="gear" title="底图 / 图层 / 对照">☰</button>
<div id="settings">
  <h4>视角</h4>
  <label><input type="checkbox" id="lockppt"> 锁定 PPT 原视角（逐页对照用）</label>
  <label><input type="checkbox" id="axo" checked> 近轴测（同 PPT，视场角 12.9°）</label>
  <label><input type="checkbox" id="cmp"> 叠加 PPT 效果图</label>
  <input type="range" id="cmpop" min="0" max="100" value="50" style="width:100%">
  <h4>底图</h4><div id="bm-list"></div><div id="crsinfo"></div>
  <h4>设计图层（Rhino 图层名见悬停提示）</h4><div id="ly-list"></div>
  <div class="note">拖拽 .glb 到页面即可预览 Rhino 模型：文件名为图层名（如 S3_HOTEL.glb）时替换该图层的占位体块；多图层 GLB 按节点名自动分配。</div>
  <div class="note"><a href="index.html">← 返回首页</a> · 数据 © OpenStreetMap contributors</div>
</div>
<div id="toast"></div>
<script src="lib/maplibre-gl.js"></script>
<script src="lib/three-bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/coord.js"></script>
<script src="js/pptcam.js"></script>
<script src="data/base-data.js"></script>
<script src="data/ortho-data.js"></script>
<script src="data/design-data.js"></script>
<script src="js/steps.js"></script>
<!-- 可选：Rhino 转出的 GLB（base64 内嵌，file:// 可用）。不存在时忽略。 -->
<script src="models/models.js" onerror="void 0"></script>
<script src="js/scene3d.js"></script>
<script src="js/story.js"></script>
</body></html>
